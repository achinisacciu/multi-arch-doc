[project]
name = "bpmn-reverse-engineer"
version = "0.1.0"
description = "BPMN 2.0 Structural Reverse Engineering Tool — first layer for SOA/Oracle cross-artifact analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "achinisacciu" }]
keywords = ["bpmn", "reverse-engineering", "soa", "oracle", "graph"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "lxml>=5.0",
  "networkx>=3.0",
  "pydantic>=2.0",
  "rich>=13.0",
  "click>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
bpmn-reverse-engineer = "bpmn_reverse_engineer.cli:main"

[project.urls]
Homepage = "https://github.com/achinisacciu/multi-arch-doc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpmn_reverse_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
